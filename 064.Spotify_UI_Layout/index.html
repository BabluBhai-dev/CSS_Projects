<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify UI</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- side bar -->
      <div class="sidebar">
        <h2>Spotify</h2>
        <ul>
          <li>Home</li>
          <li>Search</li>
          <li>Your Library</li>
        </ul>
      </div>
      <!-- main content -->
      <div class="main">
        <h2>Good Evening</h2>
        <div class="cards">
          <div class="card">Playlist 1</div>
          <div class="card">Playlist 2</div>
          <div class="card">Playlist 3</div>
          <div class="card">Playlist 4</div>
        </div>
      </div>
      <!-- player -->
      <div class="player">
        <p>Now Playing: Song Name</p>
      </div>
    </div>
  </body>
</html>
