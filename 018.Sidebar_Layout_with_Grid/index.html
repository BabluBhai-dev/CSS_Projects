<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sidebar layout with grid" />
    <title>Sidebar</title>
    <!-- social sharing -->
    <meta property="og:title" content="Sidebar" />
    <meta property="og:description" content="Sidebar layout with grid" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <!-- header section-->
    <header>
      <h1>My Dashboard</h1>
    </header>
    <div class="layout">
      <aside>
        <h2>Menu</h2>
        <ul>
          <li>Dashboard</li>
          <li>Profile</li>
          <li>Settings</li>
          <li>Logout</li>
        </ul>
      </aside>
      <main>
        <h2>Main</h2>
        <p>This is the main area where page content goes.</p>
        <p>Grid makes layout easy and clean.</p>
      </main>
    </div>
    <!-- footer -->
    <footer>
      <p>&copy; 2026 My Dashboard</p>
    </footer>
  </body>
</html>
