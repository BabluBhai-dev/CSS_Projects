<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <!-- Basic setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Essential SEO meta tags -->
    <title>Rahul Verma - Resume</title>
    <meta
      name="description"
      content="Professional resume of Rahul Verma, frontend developer skilled in HTML and CSS."
    />
    <meta
      name="keywords"
      content="resume, frontend developer, html css, web developer cv"
    />
    <meta name="author" content="Rahul Verma" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://example.com/resume" />

    <!-- Social  sharing-->
    <meta property="og:title" content="Rahul Verma – Resume" />
    <meta
      property="og:description"
      content="Clean and professional resume built using HTML and CSS."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/resume" />
    <meta property="og:image" content="resume-preview.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rahul Verma – Resume" />
    <meta
      name="twitter:description"
      content="Clean and professional resume built using HTML and CSS."
    />
    <!-- fav icon -->
    <link rel="icon" href="Favicon/favicons.png" />
  </head>
  <body>
    <h1>This is a heading</h1>
    <p>This is a paragraph</p>
  </body>
</html>
