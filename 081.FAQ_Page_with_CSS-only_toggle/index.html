<!doctype html>
<html>
  <head>
    <title>FAQ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="faq">
      <h1>Frequently Asked Questions</h1>

      <!-- ITEM 1 -->
      <div class="item">
        <input type="checkbox" id="q1" />
        <label for="q1">What is this course about?</label>
        <div class="content">
          <p>This course teaches HTML and CSS with real-world projects.</p>
        </div>
      </div>

      <!-- ITEM 2 -->
      <div class="item">
        <input type="checkbox" id="q2" />
        <label for="q2">Do I need prior knowledge?</label>
        <div class="content">
          <p>No, this is beginner to advanced level training.</p>
        </div>
      </div>

      <!-- ITEM 3 -->
      <div class="item">
        <input type="checkbox" id="q3" />
        <label for="q3">Is this project-based?</label>
        <div class="content">
          <p>Yes, every concept is taught using real UI projects.</p>
        </div>
      </div>
    </section>
  </body>
</html>
