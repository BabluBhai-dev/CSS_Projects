<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon Product</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- left Image -->
      <div class="image-section">
        <img src="image/iphone14.jpg" alt="product" />
      </div>

      <!-- middle details -->
      <div class="details">
        <h2>Apple iPhone 14 Pro (128GB) - Deep Purple</h2>
        <p class="rating">⭐⭐⭐⭐☆ 4.5 (1200 reviews)</p>
        <p class="price">₹1,29,999</p>
        <p class="desc">
          The iPhone 14 Pro features a 48MP camera, A16 Bionic chip, and Dynamic
          Island.
        </p>
      </div>
    </div>
  </body>
</html>
