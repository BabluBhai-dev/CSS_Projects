<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interior Design</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <h2>InteriorX</h2>
      <nav>
        <a href="#">Home</a>
        <a href="#">Projects</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </nav>
    </header>
    <!-- Hero -->
    <section class="hero">
      <div class="overlay"></div>
      <div class="hero-text">
        <h1>Design Your Dream Space</h1>
        <p>Luxury interiors crafted with passion</p>
        <button>View Projects</button>
      </div>
    </section>

    <!-- About -->
    <section class="about">
      <div class="text">
        <h2>About Us</h2>
        <p>
          We create modern and elegant interior spaces that reflect your
          personality.
        </p>
      </div>
    </section>
    <!-- SERVICES -->
    <section class="services">
      <div class="card">Living Room Design</div>
      <div class="card">Bedroom Design</div>
      <div class="card">Office Design</div>
    </section>

    <!-- GALLERY -->
    <section class="gallery">
      <div class="grid">
        <img src="Image/image2.jpg" height="400px" width="300px" />
        <img src="Image/image3.jpg" height="400px" width="300px" />
        <img src="Image/image4.jpg" height="400px" width="300px" />
        <img src="Image/image5.jpg" height="400px" width="300px" />
      </div>
    </section>

    <!-- TESTIMONIALS -->
    <section class="testimonials">
      <div class="testimonial">
        <p>"Beautiful design work!"</p>
        <h4>- Client</h4>
      </div>
    </section>
  </body>
</html>
