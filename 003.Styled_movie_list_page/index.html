<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <!-- Basic setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- essential seo meta tags -->
    <title>Top Movies Collection</title>
    <meta
      name="description"
      content="A styled movie list page showcasing popular movies using pure HTML and CSS."
    />
    <meta
      name="keywords"
      content="movies list, html css project, styled movie page"
    />
    <meta name="robots" content="index,follow" />
    <meta name="author" content="Bablu Bhai" />
    <link rel="canonical" href="https://example.com/movies.com" />

    <!-- Social sharing -->
    <meta property="og:title" content="Top Movies Collection" />
    <meta
      property="og:description"
      content="A clean and professional movie list layout built using HTML and CSS."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/movies" />
    <meta
      property="og:image"
      content="https://example.com/movies-preview.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Top Movies Collection" />
    <meta
      name="twitter:description"
      content="A clean and professional movie list layout built using HTML and CSS."
    />
  </head>
  <body>
    <h1>This is a Heading</h1>
    <p>This is a paragraph.</p>
  </body>
</html>
