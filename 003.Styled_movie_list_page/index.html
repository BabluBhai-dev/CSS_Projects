<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- essential SEO meta tags -->
    <title>Movie Library | Curated Picks</title>
    <meta
      name="description"
      content="A curated list of popular movies with genres, ratings, and short descriptions."
    />
    <meta name="keywords" content="movies, film list, cinema, movie library" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Bablu Bhai" />
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- style -->
    <style>
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: #0f172a;
        color: #e5e7eb;
      }
      header {
        padding: 2rem 1.5rem;
        background: linear-gradient(135deg, #1e293b, #020617);
        text-align: center;
      }
      header h1 {
        margin: 0;
        font-size: 2.2rem;
        color: #facc15;
      }
      header p {
        margin-top: 0.4rem;
        color: #cbd5f5;
      }
      .movie-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
        gap: 1.5rem;
      }
      article{
        background: #020617;
        border-radius: 12px;
        overflow:hidden;
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
      }
      article img {
        width: 100%;
        height: 380px;
        object-fit: cover;
        display: block;
      }
      .content {
        padding: 1rem;
      }

      .content h2 {
        margin: 0;
        font-size: 1.1rem;
        color: #f8fafc;
      }

      .meta {
        font-size: 0.8rem;
        color: #94a3b8;
        margin: 0.3rem 0;
      }

      .tags span {
        display: inline-block;
        background: #1e293b;
        color: #93c5fd;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-size: 0.7rem;
        margin-right: 0.3rem;
        margin-top: 0.3rem;
      }

      .rating {
        margin-top: 0.6rem;
        font-weight: 600;
        color: #facc15;
      }
    </style>
  </head>
  <body>
    <!-- header section -->
    <header>
      <h1>Movie Library</h1>
      <p>Hand-picked films worth watching</p>
    </header>
    <!-- movie list -->
    <main>
      <section class="movie-grid">
        <!-- movie 1 -->
        <article>
          <img src="images/movie1.jpg" alt="Inception movie" />
          <div class="content">
            <h2>Inception</h2>
          </div>
          <div class="meta">2010 · 2h 28m</div>
          <div class="tags"><span>Sci-Fi</span><span>Thriller</span></div>
          <p class="rating">⭐ 8.8 / 10</p>
        </article>
        <!-- movie 2 -->
        <article>
          <img src="images/movie2.jpg" alt="Inception movie" />
          <div class="content">
            <h2>Interstellar</h2>
          </div>
          <div class="meta">2014 · 2h 49m</div>
          <div class="tags"><span>Science</span><span>Drama</span></div>
          <p class="rating">⭐ 8.6 / 10</p>
        </article>
        <!-- movie 3 -->
        <article>
          <img src="images/movie3.jpeg" alt="Inception movie" />
          <div class="content">
            <h2>The Dark Knight</h2>
          </div>
          <div class="meta">2008 · 2h 32m</div>
          <div class="tags"><span>Action</span><span>Crime</span></div>
          <p class="rating">⭐ 9.0 / 10</p>
        </article>
      </section>
    </main>
  </body>
</html>
