<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- essential SEO meta tags -->
    <title>Movie Library | Curated Picks</title>
    <meta
      name="description"
      content="A curated list of popular movies with genres, ratings, and short descriptions."
    />
    <meta name="keywords" content="movies, film list, cinema, movie library" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Bablu Bhai" />
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- style -->
     <style>
        body{
            margin: 0;
            font-family: "Poppins",sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }
        header{
            padding: 2rem 1.5rem;
            background: linear-gradient(135deg,#1e293b,#020617);
            text-align: center;
        }
        header h1{
            margin: 0;
            font-size: 2.2rem;
            color: #facc15;
        }
        header p{
            margin-top: 0.4rem;
            color: #cbd5f5;
        }
     </style>
  </head>
  <body>
    <!-- header section -->
    <header>
      <h1>Movie Library</h1>
      <p>Hand-picked films worth watching</p>
    </header>
  </body>
</html>
