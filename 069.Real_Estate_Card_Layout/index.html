<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Estate Cards</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="image">
          <img src="Image/ModernApartment.jpg" />
          <span class="price">₹75L</span>
        </div>
        <div class="content">
          <h3>Modern Apartment</h3>
          <p class="location">Mumbai, India</p>
          <div class="features">
            <span>🛏 3 Beds</span>
            <span>🛁 2 Baths</span>
            <span>📐 1200 sqft</span>
          </div>
        </div>
      </div>
      <!-- dupilcate card -->
      <div class="card">
        <div class="image">
          <img src="Image/LuxuryVilla.jpg" />
          <span class="price">₹1.2Cr</span>
        </div>
        <div class="content">
          <h3>Luxury Villa</h3>
          <p class="location">Pune, India</p>
          <div class="features">
            <span>🛏 4 Beds</span>
            <span>🛁 3 Baths</span>
            <span>📐 2500 sqft</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
