<!doctype html>
<html lang="en">
  <head>
    <!-- essental meta tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Two column layout using Flexbox" />
    <meta name="author" content="Bablu Bhai" />
    <!-- Social Sharing -->
    <meta property="og:title" content="Two Column Layout" />
    <meta
      property="og:description"
      content="Responsive two column layout using Flexbox"
    />
    <meta property="og:type" content="website" />
    <title>Two Column Layout</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>Main Content</h1>
    </header>

    <main class="layout">
      <section class="content">
        <h2>Main Content</h2>
        <p>
          This is the main content area. It takes more space than the sidebar.
        </p>
      </section>
      <aside class="sidebar">
        <h3>Sidebar</h3>
        <p>Links or extra info here.</p>
      </aside>
    </main>
    <footer class="footer">
      <p>© 2026 My Website</p>
    </footer>
  </body>
</html>
