<!doctype html>
<html lang="en">
  <head>
    <!-- Basic setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width= device-width, initial-scale=1.0" />
    <title>Contact Form</title>

    <!-- Essential SEO meta tags -->
    <meta
      name="description"
      content="Beginner CSS project - Contact form styling"
    />
    <meta name="author" content="Bablu Bhai" />

    <!-- Social sharing -->
    <meta property="og:title" content="Contact Form Styling" />
    <meta
      property="og:description"
      content="Simple contact form styled using basic CSS"
    />
    <meta property="og:type" content="website" />
    <!-- Fav icon -->
    <link rel="icon" href="icon/form.png" />

    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <h1>Contact Us</h1>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" required />
        <label for="email">Email</label>
        <input type="email" id="email" required />
        <label for="message">Message</label>
        <textarea rows="5px" cols="20px" id="message"></textarea>
      </form>
    </section>
  </body>
</html>
