<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chat UI layout</title>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">Chat App</div>
      <div class="chat-box">
        <div class="message-left">Hello! How are you?</div>
        <div class="message-right">I'm good, What about you?</div>
        <div class="message-left">I'm doing great!</div>
      </div>
      <div class="chat-Input">
        <input type="text" placeholder="Type a message..." />
        <button>Send</button>
      </div>
    </div>
  </body>
</html>
