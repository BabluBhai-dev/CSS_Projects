<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Profile</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- left -->
      <aside class="left">
        <div class="card">
          <h3>About</h3>
          <p>Frontend Developer passionate about UI/UX design.</p>
        </div>
        <div class="card">
          <h3>Skills</h3>
          <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
          </ul>
        </div>
      </aside>
      <!-- main container -->
      <div class="main">
        <div class="profile-card">
          <div class="cover"></div>
          <div class="profile-info">
            <img src="https://via.placeholder.com/100" class="avatar" />
            <div class="info">
              <h2>John Doe</h2>
              <p>Frontend Developer</p>
              <p class="location">Mumbai, India</p>
            </div>
          </div>
        </div>
        <div class="post-card">
          <p>🚀 Built a Spotify UI clone using Grid & Flex!</p>
        </div>

        <div class="post-card">
          <p>💡 Learning advanced CSS layouts daily!</p>
        </div>
      </div>
    </div>
  </body>
</html>
