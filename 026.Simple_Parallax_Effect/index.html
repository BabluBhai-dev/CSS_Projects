<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Essential Meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simple parallax effect using CSS" />
    <meta name="author" content="Bablu Bhai" />

    <title>Simple Parallax</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section class="content">
      <h1>Normal Section</h1>
      <p>Scroll down to see parallax effect.</p>
    </section>
    <section class="Parallax">
      <h2>Parallax Section</h2>
    </section>
    <section class="content">
      <h2>Another Section</h2>
      <p>The background above stays fixed.</p>
    </section>
  </body>
</html>
