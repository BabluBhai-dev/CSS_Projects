<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <!-- Basic setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Responsive Image Gallery using CSS Grid"
    />
    <meta name="author" content="Bablu Bhai" />
    <title>Image Gallery</title>

    <!-- social sharing -->
    <meta property="og:title" content="Image Gallery" />
    <meta
      property="og:description"
      content="Responsive Image Gallery using CSS Grid"
    />
    <meta property="og:type" content="website" />
    <!-- fav icon -->
    <link rel="icon" href="Icon/Icon.png" />

    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- header  -->
    <header>
      <h1>Responsive Image Gallery</h1>
      <p>Built using CSS Grid</p>
    </header>
    <!-- gallery -->
    <section class="gallery">
      <figure class="item">
        <img src="image/Architecture.jpg" alt="Architecture" />
        <figcaption>Architecture</figcaption>
      </figure>
      <figure class="item">
        <img src="image/city.jpg" alt="City" />
        <figcaption>City</figcaption>
      </figure>
      <figure class="item">
        <img src="image/Forest.jpg" alt="Forest" />
        <figcaption>Forest</figcaption>
      </figure>
      <figure class="item">
        <img src="image/Mountains.jpg" alt="Mountains" />
        <figcaption>Mountains</figcaption>
      </figure>
      <figure class="item">
        <img src="image/nature.jpg" alt="nature" />
        <figcaption>Nature</figcaption>
      </figure>
      <figure class="item">
        <img src="image/Ocean.jpg" alt="Ocean" />
        <figcaption>Ocean</figcaption>
      </figure>
      <figure class="item">
        <img src="image/Sunset.jpg" alt="Sunset" />
        <figcaption>Sunset</figcaption>
      </figure>
      <figure class="item">
        <img src="image/Travel.jpg" alt="Travel" />
        <figcaption>Travel</figcaption>
      </figure>
    </section>
    <!-- footer -->
    <footer>
      <p>&copy; 2026 Image Gallery</p>
    </footer>
  </body>
</html>
