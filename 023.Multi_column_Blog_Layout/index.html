<!doctype html>
<html lang="en">
  <head>
    <!-- Basic setup  -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Blog</title>
    <!-- Essential meta tags -->
    <meta name="description" content="Multi column Blog layout" />
    <meta name="author" content="Bablu Bhai" />
    <!-- Social Sharing -->
    <meta property="og:title" content="My blogs" />
    <meta property="og:description" content="Multi column Blog layout" />
    <meta property="og:type" content="Website" />
    <!-- link css -->
     <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- header section -->
    <header>
      <h1>My Blog</h1>
    </header>
    <!-- blog section -->
    <section class="blog">
      <article>
        <h2>Learn CSS Flexbox</h2>
        <p>Flexbox helps you design flexible layouts easily and cleanly.</p>
      </article>
      <article>
        <h2>Responsive Design</h2>
        <p>Responsive design makes your website work on all screen sizes.</p>
      </article>
      <article>
        <h2>Why Practice Matters</h2>
        <p>Writing code yourself helps you understand layouts deeply.</p>
      </article>
    </section>
    <!-- footer section -->
    <footer>
      <p>&copy; 2026 My Blog</p>
    </footer>
  </body>
</html>
