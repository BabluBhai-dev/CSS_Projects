<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Booking</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Search Bar -->
    <div class="search-bar">
      <input type="text" placeholder="Location" />
      <input type="date" />
      <input type="date" />
      <button>Search</button>
    </div>

    <div class="container">
      <!-- filter -->
      <aside class="filters">
        <h3>Filters</h3>

        <label><input type="checkbox" /> ₹0 - ₹3000</label>
        <label><input type="checkbox" /> ₹3000 - ₹6000</label>

        <h3>Rating</h3>
        <label><input type="checkbox" /> ⭐⭐⭐⭐ & above</label>
        <label><input type="checkbox" /> ⭐⭐⭐ & above</label>
      </aside>
       <!-- LISTINGS -->
      <div class="listings">
        <div class="card">
          <img src="image/LuxuryHotel.jpg" />

          <div class="info">
            <h3>Luxury Hotel</h3>
            <p>Mumbai, India</p>
            <p class="rating">⭐⭐⭐⭐☆</p>
            <p class="price">₹4,999 / night</p>
            <button>Book Now</button>
          </div>
        </div>

        <div class="card">
          <img src="image/BudgetStay.jpg" />

          <div class="info">
            <h3>Budget Stay</h3>
            <p>Pune, India</p>
            <p class="rating">⭐⭐⭐☆☆</p>
            <p class="price">₹1,999 / night</p>
            <button>Book Now</button>
          </div>
        </div>
    </div>
  </body>
</html>
