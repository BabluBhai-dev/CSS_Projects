<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Booking</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />

  <body>
    <!-- Search Bar -->
    <div class="search-bar">
      <input type="text" placeholder="Location" />
      <input type="date" />
      <input type="date" />
      <button>Search</button>
    </div>

    <div class="container">
      <!-- filter -->
      <aside class="filter">
        <h3>Filters</h3>

        <label><input type="checkbox" /> ₹0 - ₹3000</label>
        <label><input type="checkbox" /> ₹3000 - ₹6000</label>

        <h3>Rating</h3>
        <label><input type="checkbox" /> ⭐⭐⭐⭐ & above</label>
        <label><input type="checkbox" /> ⭐⭐⭐ & above</label>
      </aside>
    </div>
  </body>
