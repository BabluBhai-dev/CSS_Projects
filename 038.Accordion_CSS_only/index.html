<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrapper">
      <!-- add Accordion in the group -->
      <section class="accordion">
        <!-- item 1 -->
        <div class="item">
          <input type="checkbox" id="item1" />
          <label for="item1">What is CSS?</label>
          <div class="content">
            <p>CSS is used to style and design web pages.</p>
          </div>
        </div>
        <!-- item 2 -->
         <div class="item">
          <input type="checkbox" id="item2" />
          <label for="item2">What is an Accordion?</label>
          <div class="content">
            <p>An accordion shows and hides content when clicked.</p>
          </div>
        </div>
        <!-- item 3 -->
         <div class="item">
          <input type="checkbox" id="item3" />
          <label for="item3">Why CSS-only?</label>
          <div class="content">
            <p>Because we can use checkbox :checked state to control visibility.</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
