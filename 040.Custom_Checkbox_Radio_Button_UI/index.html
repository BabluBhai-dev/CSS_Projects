<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom checkbox & Radio</title>
    <!-- link css -->
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--wrap the content   -->
    <div class="wrapper">
        <h2>Custom Checkbox</h2>
        <label class="custom-checkbox"><input type="checkbox">Accept Terms</label>
        <label class="custom-checkbox">
            <input type="checkbox">
            Subscribe Newsletter
        </label>
        <h2>Custom Radio</h2>
       <label class="custom-radio"><input type="radio" name="gender">Male</label>
       <label class="custom-radio"><input type="radio" name="gender">Female</label>
    </div>
</body>
</html>
