<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Agency</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <h2>TravelX</h2>
      <nav>
        <a href="#">Home</a>
        <a href="#">Destination</a>
        <a href="#">Packages</a>
        <a href="#">Contact</a>
      </nav>
    </header>
    <!-- Hero section -->
    <section class="hero">
      <div class="overlay"></div>
      <div class="hero-content">
        <h1>Explore the world 🌍</h1>
        <p>Find your perfect trip with us</p>
        <div class="search">
          <input type="text" placeholder="Where to?" />
          <button>Search</button>
        </div>
      </div>
    </section>
    <!-- destination -->
    <section class="destination">
      <h2>Popular Destination</h2>
      <div class="grid">
        <div class="card">
          <img src="image/paris.jpg" />
          <h3>Paris</h3>
        </div>
        <div class="card">
          <img src="image/bali.jpg" />
          <h3>Bali</h3>
        </div>
        <div class="card">
          <img src="image/dubai.webp" />
          <h3>Dubai</h3>
        </div>
      </div>
    </section>
    <!-- SERVICES -->
    <section class="services">
      <div class="service">✈️ Flight Booking</div>
      <div class="service">🏨 Hotel Booking</div>
      <div class="service">🚗 Car Rental</div>
    </section>
  </body>
</html>
