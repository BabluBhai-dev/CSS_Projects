<!doctype html>
<html lang="en">
  <head>
    <!-- Basic setup -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport = device-width, initial-scale=1.0"
    />
    <title>Center login box</title>
    <!-- Essential SEO meta tags -->
    <meta
      name="description"
      content="A simple centered login box built using HTML and CSS for beginners."
    />
    <meta
      name="keywords"
      content="login page, html css practice, beginner css, centered layout"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Bablu Bhai" />
    <!-- Social sharing -->
    <meta property="og:title" content="Centered Login Box" />
    <meta
      property="og:description"
      content="Beginner-friendly centered login box using pure HTML and CSS."
    />
    <meta property="og:type" content="website" />
    <!-- Fav icons -->
    <link rel="icon" href="icon/icons.png" />
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- section -->
    <section>
      <h1>Login</h1>
      <p>Access your account</p>
      <form>
        <label for="email">Email</label><br />
        <input type="text" id="email" required /><br />
        <label>Password</label><br />
        <input type="password" id="password" required /><br />
        <button>Sign In</button>
        <p>Forgot password?</p>
      </form>
    </section>
  </body>
</html>
