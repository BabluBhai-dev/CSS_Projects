<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="player">
      <img
        src="image/download.jpg"
        height="250px"
        width="250px"
        class="cover"
      />
      <h2>Song Name</h2>
      <p>Artist Name</p>

      <!-- progress -->
      <div class="progress">
        <div class="bar"></div>
      </div>

      <!-- controls -->
      <div class="controls">
        <button>⏮</button>
        <button class="play">▶</button>
        <button>⏭</button>
      </div>
    </div>
  </body>
</html>
