<!doctype html>
<html lang="en">
  <head>
    <!-- Basic setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post</title>
    <!-- Essential SEO meta tags -->
    <meta
      name="description"
      content="This is a simple blog page. Good spacing and readable fonts make content easy to read."
    />
    <meta name="robots" content="follow,index" />
    <meta name="author" content="Bablu Bhai" />

    <!-- Social sharing -->
    <meta property="og:title" content="Blog Post" />
    <meta
      property="og:description"
      content="This is a simple blog page. Good spacing and readable fonts make content easy to read."
    />
    <meta property="og:type" content="website" />
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- main section -->
    <main>
      <header>
        <h1>My First Blog Post</h1>
        <p>
          This is a simple blog page. Good spacing and readable fonts make
          content easy to read.
        </p>
      </header>
      <article>
        <h2>Why CSS Matters</h2>
        <p>
          CSS controls how content looks. Even simple styles can improve user
          experience a lot.
        </p>
      </article>
      <article>
        <h3>Conclusion</h3>
        <p>Learning basic CSS step by step builds a strong foundation.</p>
      </article>
    </main>
  </body>
</html>
