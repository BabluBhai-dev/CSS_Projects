<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline layout</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="timeline">
      <div class="container left">
        <div class="content">
          <h2>2022</h2>
          <p>Started learning HTML & CSS.</p>
        </div>
      </div>
      <div class="container right">
        <div class="content">
          <h2>2023</h2>
          <p>Built multiple frontend projects.</p>
        </div>
      </div>
      <div class="container left">
        <div class="content">
          <h2>2024</h2>
          <p>Mastered CSS animations and layouts.</p>
        </div>
      </div>
      <div class="container right">
        <div class="content">
          <h2>2025</h2>
          <p>Started advanced UI design.</p>
        </div>
      </div>
    </main>
  </body>
</html>
